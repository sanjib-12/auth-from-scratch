<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8" />
   <title>Enable MFA</title>
   <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
   <div class="card mfa-card">
      <h2>Set Up Email OTP</h2>

      <div id="mfa-section">
         <button id="enable-email-otp" class="mfa-btn-enable" type="button">Enable Email OTP</button>
      </div>

      <div id="success-message"></div>

      <form id="mfa-form" style="display: none;">
         <input type="text" id="otp-code" placeholder="6-digit code" maxlength="6" pattern="\d{6}" required
                  autocomplete="one-time-code" inputmode="numeric" />
         <button id="btn-mfa-verify" type="submit">Verify</button>
         <button id="btn-mfa-resend" type="submit">Resend Code</button>
      </form>

      <div id="message"></div>
   </div>

   <div>
      <a href="dashboard.html">dashboard</a>
   </div>

   <script type="module" src="../dist/mfa-email-setup.js"></script>
</body>

</html>
