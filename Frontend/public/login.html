<!DOCTYPE html>
<html>

<head>
   <title>Login</title>
   <link rel="stylesheet" href="css/styles.css" />
</head>

<body>

   <h2>Login</h2>

   <form id="login-form">
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />
      <button id="btn-login" type="submit">Login</button>
   </form>

   <div style="text-align:center; margin: 16px 0; color: #888;">or</div>

   <a href="http://127.0.0.1:5000/oauth/google/start" id="google-link" >
      Login with Google
   </a>

   <p id="oauthError" style="color:red; text-align:center; display:none;"></p>

   <div>
      <a href="signup.html">Sign up</a>
   </div>

   <div id="message"></div>

   <script type="module" src="../dist/login.js"></script>
</body>

</html>
